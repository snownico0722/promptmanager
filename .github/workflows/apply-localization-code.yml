name: Apply localization code cleanup
on:
  push:
    branches: [fix/localization-cleanup]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact code fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def exact_replace(path, old, new):
              p = Path(path); s = p.read_text()
              if old in s: p.write_text(s.replace(old, new)); return
              if new not in s: raise SystemExit(f'expected text missing in {path}: {old}')

          replacements = {
              '页面内 界面 会在观察器挂载前完成加载；切换视图时会清理滚动条计时器。': '页面内界面会在观察器挂载前完成加载；切换视图时会清理滚动条计时器。',
              '网站社区导入不再依赖静态内容脚本，因此已有安装不会在更新后被 Chrome 禁用。': '社区网站上的提示词导入不再依赖静态内容脚本，因此已有安装不会在更新后被 Chrome 禁用。',
              '改进分享及用户名检查错误提示；Chrome 商店版和解压安装版都可从网站社区导入。': '改进分享及用户名检查错误提示；Chrome 商店版和解压安装版都可从社区网站导入提示词。',
              '可用你的发布用户名从侧边栏发布提示词（标题、正文、标签），社区导入仍保持一键完成。': '可用你的发布用户名从侧边栏发布提示词（标题、正文、标签），仍可从社区网站一键导入提示词。',
              '设置中加入社区目录入口；Chrome 商店扩展可从社区网站一键导入，更新时无需新增社区网站权限。': '设置中加入社区提示词库入口；Chrome 商店扩展可从社区网站一键导入，更新时无需新增社区网站权限。',
              '更新部分 界面，后续还会继续优化。': '更新部分界面，后续还会继续优化。',
              '将内联 SVG 图标替换为 Material 界面 图标。': '将内联 SVG 图标替换为 Material UI 图标。',
              '通过更新图标和增加说明性提示改进 UX/界面 与导航清晰度。': '通过更新图标和增加说明性提示，改进用户体验（UX）、界面与导航清晰度。',
              '新增提示词变量，可用 #变量名# 在使用时快速填入动态值。': '新增提示词变量，可用 #name# 这类变量在使用时快速填入动态值。',
              '重做完整 界面 主题和动画，包括深色模式。': '重做完整界面主题和动画，包括深色模式。',
              '修复不同视图切换时 界面 不一致的问题。': '修复不同视图切换时界面不一致的问题。',
              '导入/导出支持 U界面D，可智能合并提示词。': '导入/导出支持 UUID，可智能合并提示词。',
          }
          p = Path('src/changelog.zh-CN.html'); s = p.read_text()
          for old, new in replacements.items():
              if old in s: s = s.replace(old, new)
              elif new not in s: raise SystemExit(f'changelog text missing: {old}')
          p.write_text(s)

          exact_replace('src/service-worker.js', "globalThis.OPMI18n.subscribe(createPromptContextMenu);", "chrome.storage.onChanged.addListener((changes, areaName) => {\n  if (areaName === 'local' && Object.hasOwn(changes, 'uiLanguage')) {\n    createPromptContextMenu();\n  }\n});")
          exact_replace('src/service-worker.js', "// Rebuild once on worker wake, including extension reloads.\ncreatePromptContextMenu();\nclearStaleDevOnboardingFlag();", "// Context menus persist while the MV3 worker sleeps. Rebuild only for actual\n// lifecycle/data/language changes, not on every worker wake.\nclearStaleDevOnboardingFlag();")

          p = Path('package.json'); obj = json.loads(p.read_text())
          obj['scripts']['build:prod'] = "node -e \"const fs=require('fs');const m=JSON.parse(fs.readFileSync('src/manifest.json','utf8'));if(m.manifest_version!==3||!m.background?.service_worker)throw new Error('Invalid production manifest');console.log('Production manifest OK')\""
          p.write_text(json.dumps(obj, ensure_ascii=False, indent=4) + '\n')

          p = Path('tests/localization/worker.test.mjs'); s = p.read_text()
          old = "    storage: { local: { get: async () => ({ uiLanguage: 'zh-CN' }), set: async () => {}, remove: async () => {} }, onChanged: event() },"
          new = """    storage: {\n      local: {\n        get: async () => ({ uiLanguage: chrome.__storedLanguage || 'zh-CN' }),\n        set: async values => {\n          if (!Object.hasOwn(values, 'uiLanguage')) return;\n          const oldValue = chrome.__storedLanguage || 'zh-CN';\n          chrome.__storedLanguage = values.uiLanguage;\n          queueMicrotask(() => {\n            for (const listener of chrome.storage.onChanged.listeners) listener({ uiLanguage: { oldValue, newValue: values.uiLanguage } }, 'local');\n          });\n        },\n        remove: async () => {},\n      },\n      onChanged: event(),\n    },"""
          if old in s: s = s.replace(old, new)
          elif new not in s: raise SystemExit('worker storage mock not found')
          needle = "test('one menu owner, deterministic order, translated defaults, literal user titles', async () => {"
          block = """test('worker wake does not rebuild persistent context menus by itself', async () => {\n  const r = setup();\n  await r.context.OPMI18n.ready;\n  await new Promise(resolve => setImmediate(resolve));\n  assert.equal(r.removes, 0);\n  assert.equal(r.items.size, 0);\n});\n\n"""
          if block not in s:
              if needle not in s: raise SystemExit('worker test insertion point missing')
              s = s.replace(needle, block + needle, 1)
          p.write_text(s)
          PY
      - name: Install and verify
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build:prod
          find src -name '*.js' -print0 | xargs -0 -n 1 node --check
          npm run test:i18n:unit
          npx jest tests/utils.test.js tests/promptInsertUtils.test.js tests/originPatterns.test.js --runInBand
          ! grep -Eq '页面内 界面|更新部分 界面|Material 界面|UX/界面|#变量名#|完整 界面|切换时 界面|U界面D|网站社区' src/changelog.zh-CN.html
      - name: Commit reviewed fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/changelog.zh-CN.html src/service-worker.js package.json tests/localization/worker.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'fix: finish localization cleanup'
          git push
