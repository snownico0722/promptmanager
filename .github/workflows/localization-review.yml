name: Localization review
on:
  push:
    branches: [fix/i18n-review-quality]
  pull_request:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: find src -name '*.js' -print0 | xargs -0 -n 1 node --check
      - name: Archive review source
        run: git archive --format=zip HEAD -o review-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: review-source
          path: review-source.zip
          retention-days: 1
